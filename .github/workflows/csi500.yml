name: CSI500 Daily Push

on:
  schedule:
    # 工作日 北京时间 15:00 触发（UTC 05:00）
    - cron: '17 5 * * 1-5'
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查当前服务器时间
        run: date -u

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run push
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: python csi500_push.py
