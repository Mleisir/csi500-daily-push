name: CSI500 Daily Push

on:
  # 工作日 北京时间 15:30 触发（UTC = 北京时间 - 8）
  schedule:
    - cron: '30 5 * * 1-5'
  # 允许手动触发，方便测试
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run push
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: python csi500_push.py
